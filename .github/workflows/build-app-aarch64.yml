name: Build Terminal aarch64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-app-aarch64.yml"
      - "packaging/**"
      - "pubspec.yaml"
      - "lib/**"
      - "elinux/**"
      - "rust/**"

env:
  FLUTTER_ELINUX_VERSION: "3.47.1"
  NFPM_VERSION: "2.47.0"
  PULP_CLI_VERSION: "0.41.1"
  MECHANIX_PACKAGER_VERSION: "v0.0.3"
  ELINUX_ENGINE_BASE_URL: ${{ vars.CI_ELINUX_ENGINE_BASE_URL }}
  # Packages are built on every branch, but uploaded only from main and canary.
  PUBLISH: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary' }}

jobs:
  version:
    name: Resolve rpm release
    runs-on: ubuntu-24.04-arm
    environment: canary
    outputs:
      rpm_release: ${{ steps.resolve.outputs.rpm_release }}

    env:
      MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
      MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
      MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install mechanix-packager
        run: |
          mkdir -p "$RUNNER_TEMP/mechanix-packager"
          curl -fsSL "https://github.com/mecha-org/mechanix-packager/archive/refs/tags/${MECHANIX_PACKAGER_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mechanix-packager" --strip-components=1
          echo "MECHANIX_PACKAGER_DIR=$RUNNER_TEMP/mechanix-packager" >> "$GITHUB_ENV"

      # One release number per run, shared by every Fedora target (rpm job appends .fcNN).
      - name: Resolve rpm release
        id: resolve
        run: |
          set -euo pipefail
          RPM_JSON=$(python3 "$MECHANIX_PACKAGER_DIR/resolve_version.py" --format rpm)
          echo "rpm_release=$(echo "$RPM_JSON" | jq -r .release)" >> "$GITHUB_OUTPUT"

  rpm:
    name: rpm (fc${{ matrix.fedora }})
    needs: version
    runs-on: ubuntu-24.04-arm
    environment: canary
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]

    env:
      FEDORA: ${{ matrix.fedora }}
      RPM_RELEASE: ${{ needs.version.outputs.rpm_release }}.fc${{ matrix.fedora }}
      MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
      MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
      MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
      MECHA_PULP_RPM_CHANNEL: ${{ vars.MECHA_PULP_RPM_CHANNEL }}

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git tar unzip xz curl jq which findutils python3 file \
            clang cmake ninja-build pkgconf-pkg-config gcc-c++ \
            wayland-devel libxkbcommon-devel mesa-libEGL-devel mesa-libGLES-devel \
            gstreamer1-devel gstreamer1-plugins-base-devel

      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Install mechanix-packager
        run: |
          mkdir -p "$RUNNER_TEMP/mechanix-packager"
          curl -fsSL "https://github.com/mecha-org/mechanix-packager/archive/refs/tags/${MECHANIX_PACKAGER_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mechanix-packager" --strip-components=1
          echo "MECHANIX_PACKAGER_DIR=$RUNNER_TEMP/mechanix-packager" >> "$GITHUB_ENV"

      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install Flutter eLinux Toolchain
        run: |
          git config --global --add safe.directory '*'
          git clone --branch "$FLUTTER_ELINUX_VERSION" --depth 1 https://github.com/flutter-elinux/flutter-elinux.git /opt/flutter-elinux
          test -x /opt/flutter-elinux/bin/flutter-elinux
          echo "/opt/flutter-elinux/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Build terminal
        run: |
          : "${ELINUX_ENGINE_BASE_URL:?CI_ELINUX_ENGINE_BASE_URL is not set}"
          echo "[INFO] flutter-elinux engine artifacts from $ELINUX_ENGINE_BASE_URL"
          flutter-elinux pub get
          flutter-elinux build elinux --release

      - name: Package RPM
        run: |
          set -euo pipefail
          python3 "$MECHANIX_PACKAGER_DIR/package.py" ./dist --formats rpm --release "$RPM_RELEASE"

          RPM_FILE="./dist/mechanix-terminal-$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)-${RPM_RELEASE}.aarch64.rpm"
          [ -f "$RPM_FILE" ] || { echo "[ERROR] expected package not built: $RPM_FILE"; ls -la ./dist; exit 1; }
          SIZE_MB=$(( $(stat -c%s "$RPM_FILE") / 1048576 ))
          [ "$SIZE_MB" -ge 1 ] || { echo "[ERROR] $RPM_FILE too small: ${SIZE_MB} MB"; exit 1; }
          echo "[INFO] built $(basename "$RPM_FILE") (${SIZE_MB} MB)"
          echo "RPM_FILE=$RPM_FILE" >> "$GITHUB_ENV"

      - name: Setup | Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          python3 -m venv /opt/pulp-cli
          /opt/pulp-cli/bin/pip install --quiet "pulp-cli==${PULP_CLI_VERSION}"
          echo "/opt/pulp-cli/bin" >> "$GITHUB_PATH"

      - name: Configure Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          PULP_API_URL="$(printf '%s' "${MECHA_PULP_API_URL}" | tr -d '[:space:]')"
          PULP_API_URL="${PULP_API_URL%/}"
          [ -n "$PULP_API_URL" ] || { echo "[ERROR] MECHA_PULP_API_URL is empty"; exit 1; }
          [ -n "$MECHA_PULP_RPM_CHANNEL" ] || { echo "[ERROR] MECHA_PULP_RPM_CHANNEL is empty"; exit 1; }
          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "$PULP_API_URL" \
            --overwrite

      # Uploading also signs the package (repo signing service) and publishes the repo.
      - name: Publish RPM
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          REPO="repo-rpm-fedora-${FEDORA}-${MECHA_PULP_RPM_CHANNEL}"
          echo "[INFO] Uploading $(basename "$RPM_FILE") to $REPO"
          pulp rpm content upload --repository "$REPO" --file "$RPM_FILE"

      - name: Verify package is served
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BASE="https://pkg.mecha.so/repo/rpm/fedora-${FEDORA}/${MECHA_PULP_RPM_CHANNEL}"
          WANT="$(basename "$RPM_FILE")"
          for _ in $(seq 1 40); do
            PRIMARY=$(curl -fsSL "$BASE/repodata/repomd.xml" | grep -oP 'href="\Krepodata/[^"]*primary\.xml[^"]*')
            if curl -fsSL "$BASE/$PRIMARY" | { zcat 2>/dev/null || cat; } | grep "<location href=\"[^\"]*/${WANT}\"" >/dev/null; then
              echo "[INFO] served at $BASE: $WANT"
              exit 0
            fi
            sleep 15
          done
          echo "[ERROR] $WANT not served at $BASE after 10 minutes"
          exit 1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanix-terminal-rpm-fc${{ matrix.fedora }}
          path: ./dist/*.rpm

  deb:
    name: deb (trixie)
    runs-on: ubuntu-24.04-arm
    environment: canary

    env:
      MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
      MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
      MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
      MECHA_PULP_DEBS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}
      MECHA_PULP_DEB_DISTRIBUTION: ${{ vars.MECHA_PULP_DEB_DISTRIBUTION }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git tar unzip curl clang cmake pkg-config \
            libwayland-dev libwayland-cursor0 libwayland-egl1 \
            libwayland-egl-backend-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            build-essential jq python3-venv

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_arm64.deb"
          sudo dpkg -i nfpm.deb
          rm nfpm.deb

      - name: Install mechanix-packager
        run: |
          mkdir -p "$RUNNER_TEMP/mechanix-packager"
          curl -fsSL "https://github.com/mecha-org/mechanix-packager/archive/refs/tags/${MECHANIX_PACKAGER_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mechanix-packager" --strip-components=1
          echo "MECHANIX_PACKAGER_DIR=$RUNNER_TEMP/mechanix-packager" >> "$GITHUB_ENV"

      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install Flutter eLinux Toolchain
        run: |
          git clone --branch "$FLUTTER_ELINUX_VERSION" --depth 1 https://github.com/flutter-elinux/flutter-elinux.git /opt/flutter-elinux
          test -x /opt/flutter-elinux/bin/flutter-elinux
          echo "/opt/flutter-elinux/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build Rust library
        run: |
          cd rust
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Build terminal
        run: |
          : "${ELINUX_ENGINE_BASE_URL:?CI_ELINUX_ENGINE_BASE_URL is not set}"
          echo "[INFO] flutter-elinux engine artifacts from $ELINUX_ENGINE_BASE_URL"
          flutter-elinux pub get
          flutter-elinux build elinux --release

      - name: Resolve deb release
        id: version
        run: |
          set -euo pipefail
          DEB_JSON=$(python3 "$MECHANIX_PACKAGER_DIR/resolve_version.py" --format deb)
          echo "deb_release=$(echo "$DEB_JSON" | jq -r .release)" >> "$GITHUB_OUTPUT"

      - name: Package DEB
        run: |
          set -euo pipefail
          python3 "$MECHANIX_PACKAGER_DIR/package.py" ./dist --formats deb --release "${{ steps.version.outputs.deb_release }}"

          DEB_FILE=$(find ./dist -name "mechanix-terminal*.deb" -type f | head -n1)
          [ -f "$DEB_FILE" ] || { echo "[ERROR] deb not built"; ls -la ./dist; exit 1; }
          SIZE_MB=$(( $(stat -c%s "$DEB_FILE") / 1048576 ))
          [ "$SIZE_MB" -ge 1 ] || { echo "[ERROR] $DEB_FILE too small: ${SIZE_MB} MB"; exit 1; }
          echo "[INFO] built $(basename "$DEB_FILE") (${SIZE_MB} MB)"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Setup | Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pulp-cli"
          "$RUNNER_TEMP/pulp-cli/bin/pip" install --quiet "pulp-cli==${PULP_CLI_VERSION}" pulp-cli-deb
          echo "$RUNNER_TEMP/pulp-cli/bin" >> "$GITHUB_PATH"

      - name: Configure Pulp CLI
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          PULP_API_URL="$(printf '%s' "${MECHA_PULP_API_URL}" | tr -d '[:space:]')"
          PULP_API_URL="${PULP_API_URL%/}"
          [ -n "$PULP_API_URL" ] || { echo "[ERROR] MECHA_PULP_API_URL is empty"; exit 1; }
          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "$PULP_API_URL" \
            --overwrite

      - name: Publish DEB
        if: env.PUBLISH == 'true'
        env:
          DEB_SIGNING_SERVICE_HREF: /pulp/api/v3/signing-services/01a06111-aea8-744f-89a8-0d86ae025e5d/
        run: |
          set -euo pipefail
          echo "[INFO] Uploading $DEB_FILE to $MECHA_PULP_DEBS_REPOSITORY_NAME"
          pulp deb content upload \
            --repository="$MECHA_PULP_DEBS_REPOSITORY_NAME" \
            --file="$DEB_FILE" \
            --distribution="$MECHA_PULP_DEB_DISTRIBUTION" \
            --component=main

          REPO_HREF=$(pulp deb repository show --name="$MECHA_PULP_DEBS_REPOSITORY_NAME" | jq -r '.pulp_href')
          PULP_API_URL="$(printf '%s' "${MECHA_PULP_API_URL}" | tr -d '[:space:]')"
          PULP_API_URL="${PULP_API_URL%/}"

          TASK_HREF=$(curl -sf -u "${MECHA_PULP_USERNAME}:${MECHA_PULP_PASSWORD}" \
            -X POST "${PULP_API_URL}/pulp/api/v3/publications/deb/apt/" \
            -H "Content-Type: application/json" \
            -d "{\"repository\": \"${REPO_HREF}\", \"signing_service\": \"${DEB_SIGNING_SERVICE_HREF}\"}" \
            | jq -r '.task')

          STATE=""
          for _ in $(seq 1 60); do
            TASK_JSON=$(curl -sf -u "${MECHA_PULP_USERNAME}:${MECHA_PULP_PASSWORD}" "${PULP_API_URL}${TASK_HREF}")
            STATE=$(echo "$TASK_JSON" | jq -r '.state')
            [ "$STATE" = "completed" ] && break
            if [ "$STATE" = "failed" ] || [ "$STATE" = "canceled" ]; then
              echo "[ERROR] DEB publication task ${STATE}: $(echo "$TASK_JSON" | jq -r '.error')"
              exit 1
            fi
            sleep 2
          done
          [ "$STATE" = "completed" ] || { echo "[ERROR] DEB publication task did not complete in time"; exit 1; }
          echo "[INFO] DEB publication: $(echo "$TASK_JSON" | jq -r '.created_resources[0]')"

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanix-terminal-deb
          path: ./dist/*.deb
